<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SENADI | ESIGEF</title>
    <link rel="stylesheet" th:href="@{/estilos.css(v=matrices)}">
    <script defer th:src="@{/js/matriz-poa.js(v=20261117combos)}"></script>
</head>
<body>
<main>
    <div th:replace="~{fragmentos/matrices :: cabecera('esigef')}"></div>

    <section class="tarjeta">
        <p class="error" th:if="${errorConsulta}" th:text="${errorConsulta}" role="alert"></p>
        <p th:if="${reporteSeleccionado == null}" role="status">No hay reportes eSIGEF cargados.</p>
        <div th:if="${matriz != null}">
            <h2 th:text="${archivoReporte}"></h2>
            <p class="nota" th:text="${#lists.size(matriz.filas) + ' filas'}" role="status"></p>
            <div id="desplazamiento-superior" class="desplazamiento-superior" tabindex="0"
                 role="region" aria-label="Desplazamiento horizontal" aria-controls="tabla-matriz">
                <div id="contenido-desplazamiento"></div>
            </div>
            <div id="tabla-matriz" class="tabla" tabindex="0" role="region" aria-label="Matriz eSIGEF">
                <table>
                    <thead>
                    <tr>
                        <th scope="col" th:each="encabezado : ${matriz.encabezados}"
                            th:text="${encabezado}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fila : ${matriz.filas}">
                        <td th:each="encabezado, estado : ${matriz.encabezados}"
                            th:text="${estado.index < #lists.size(fila) ? fila[estado.index] : ''}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(matriz.filas)}">
                        <td th:colspan="${#lists.size(matriz.encabezados)}">No hay filas que mostrar.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    <footer>Servicio Nacional de Derechos Intelectuales</footer>
</main>
</body>
</html>
