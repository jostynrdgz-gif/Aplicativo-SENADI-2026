<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SENADI | POACOMBINADA</title>
    <link rel="stylesheet" th:href="@{/estilos.css(v=matrices)}">
    <script defer th:src="@{/js/matriz-poa.js(v=20261117combos)}"></script>
</head>
<body>
<main>
    <div th:replace="~{fragmentos/matrices :: cabecera('combinada')}"></div>

    <section class="tarjeta" th:if="${matriz == null}">
        <p role="status">Sube una matriz POA para ver la POA combinada.</p>
    </section>
    <section class="tarjeta" th:if="${matriz != null}">
        <h2 th:text="${matriz.archivo}"></h2>
        <p th:if="${reporteSeleccionado == null}" role="status">
            Sube un reporte eSIGEF para cruzar los códigos y calcular el devengado.
        </p>
        <p th:if="${archivoReporte != null and matriz.errorConsulta == null}" class="nota">
            Devengado de registros aprobados en <strong th:text="${archivoReporte}"></strong>.
        </p>
        <p class="error" th:if="${matriz.errorConsulta}" th:text="${matriz.errorConsulta}" role="alert"></p>

        <div id="desplazamiento-superior" class="desplazamiento-superior" tabindex="0"
             role="region" aria-label="Desplazamiento horizontal" aria-controls="tabla-matriz">
            <div id="contenido-desplazamiento"></div>
        </div>
        <div id="tabla-matriz" class="tabla" tabindex="0" role="region" aria-label="Matriz POA combinada">
            <table>
                <thead>
                <tr>
                    <th scope="col">Código único extraído del eSIGEF</th>
                    <th scope="col">Devengado calculado (USD)</th>
                    <th scope="col" th:each="encabezado : ${matriz.encabezados}" th:text="${encabezado}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fila : ${matriz.filas}">
                    <td th:text="${fila.codigoEsigef.isEmpty() ? '—' : fila.codigoEsigef}"></td>
                    <td th:text="${fila.devengado == null ? '—' : #numbers.formatDecimal(fila.devengado, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:each="encabezado, estado : ${matriz.encabezados}"
                        th:text="${estado.index < #lists.size(fila.valores) ? fila.valores[estado.index] : ''}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(matriz.filas)}">
                    <td th:colspan="${#lists.size(matriz.encabezados) + 2}">La POA no contiene filas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <footer>Servicio Nacional de Derechos Intelectuales</footer>
</main>
</body>
</html>
