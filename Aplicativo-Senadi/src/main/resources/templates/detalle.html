<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SENADI · Datos importados</title><link rel="stylesheet" href="/estilos.css"></head><body><main><header><span class="marca">SENADI / GESTIÓN DE DATOS</span><a href="/">← Volver a importar</a></header><p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p><h1 th:text="${lote.archivo}"></h1><p>Hoja: <strong th:text="${lote.hoja}"></strong> · <span th:text="${lote.filas}"></span> filas almacenadas.</p><section class="tarjeta"><h2>Datos guardados</h2><p>Vista de las primeras 200 filas. Las demás permanecen almacenadas.</p><div class="tabla"><table><thead><tr><th th:each="columna:${lote.encabezados}" th:text="${columna}"></th></tr></thead><tbody><tr th:each="fila:${lote.datos}"><td th:each="celda:${fila}" th:text="${celda}"></td></tr></tbody></table></div></section></main></body></html>
